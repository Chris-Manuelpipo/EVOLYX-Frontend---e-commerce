<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('evolyx-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* stockage indisponible */ }
    })();
  </script>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1814">
  <title>Favoris : EVOLYX Shop</title>
  <meta name="description" content="Vos produits favoris EVOLYX Shop. Retrouvez-les et commandez par WhatsApp.">
  <meta property="og:title" content="Favoris : EVOLYX Shop">
  <meta property="og:description" content="Liste de souhaits EVOLYX Shop.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shop.evolyx.cm/wishlist.html">
  <meta property="og:image" content="https://shop.evolyx.cm/assets/og-image.png">
  <meta property="og:site_name" content="EVOLYX Shop">
  <link rel="canonical" href="https://shop.evolyx.cm/wishlist.html">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=mobile-2col2">
</head>
<body>
  <a class="skip-link" href="#wishlistGrid">Aller aux favoris</a>
  <div id="site-header"></div>
  <main class="page-main">
    <div class="container">
      <h1>Favoris</h1>
      <p class="text-gray">Touchez le cœur sur un produit pour le retrouver ici. La liste est synchronisée avec le serveur.</p>
      <div class="products-grid" id="wishlistGrid"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/layout.js?v=footer-copy"></script>
  <script src="js/catalog.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => Wishlist.renderPage());
  </script>
</body>
</html>
