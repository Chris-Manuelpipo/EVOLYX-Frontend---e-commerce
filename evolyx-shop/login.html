<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('evolyx-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* stockage indisponible */ }
    })();
  </script>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1814">
  <title>Connexion admin : EVOLYX Shop</title>
  <meta name="description" content="Espace administrateur EVOLYX Shop.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <div class="login-toolbar" id="theme-slot"></div>
    <a class="login-brand" href="index.html">
      <img src="assets/logo.png" alt="" width="32" height="32">
      <span>EVOLYX <span class="brand-accent">Shop</span></span>
    </a>
    <div class="card">
      <h1 class="text-xl">Administration</h1>
      <p class="text-gray">Gérez le catalogue et les commandes.</p>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <div class="password-field">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Afficher le mot de passe" aria-pressed="false">
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:8px;">Se connecter</button>
      </form>
      <p class="text-center" style="margin-top:1rem;">
        <a href="index.html">Retour à la boutique</a>
      </p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
