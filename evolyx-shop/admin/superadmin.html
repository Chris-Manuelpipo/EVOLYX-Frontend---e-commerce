<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('evolyx-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* stockage indisponible */ }
    })();
  </script>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1814">

  <title>Créer un administrateur : EVOLYX</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="admin-container">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <div class="admin-topbar">
        <div class="topbar-content">
          <h1>Administrateurs</h1>
        </div>
      </div>
      <div class="admin-content">
        <div id="superadminGate" hidden></div>
        <div id="superadminFormWrap" class="card" hidden>
          <h2>Créer un compte admin</h2>
          <p class="text-gray">Réservé au rôle super_admin. L’API attend POST /admin/admins.</p>
          <form id="adminCreateForm">
            <div class="form-group">
              <label for="adminEmail">E-mail</label>
              <input type="email" id="adminEmail" name="email" required autocomplete="off">
            </div>
            <div class="form-group">
              <label for="adminPassword">Mot de passe</label>
              <div class="password-field">
                <input type="password" id="adminPassword" name="password" minlength="8" required>
                <button type="button" class="password-toggle" data-password-toggle="adminPassword" aria-label="Afficher le mot de passe" aria-pressed="false">
                  <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>
            <div class="form-group">
              <label for="adminRole">Rôle</label>
              <select id="adminRole" name="role">
                <option value="admin">admin</option>
                <option value="super_admin">super_admin</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Créer</button>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script src="../js/admin-admins.js"></script>
</body>
</html>
