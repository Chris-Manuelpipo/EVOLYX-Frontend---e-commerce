<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('evolyx-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* stockage indisponible */ }
    })();
  </script>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1814">

  <title>Gestion Produits - EVOLYX Admin</title>
  <meta name="robots" content="noindex">
    <link rel="icon" href="../assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
   <!-- Dans le <head> de votre HTML -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- ✅ Favicon --> 
  
</head>
<body>
  <div class="admin-container">
    <!-- SIDEBAR -->
    <aside class="admin-sidebar" id="admin-sidebar"></aside>


    <!-- MAIN CONTENT -->
    <main class="admin-main">
      <!-- TOPBAR -->
      <div class="admin-topbar">
        <div class="topbar-content">
          <h1>Gestion Produits</h1>
          <button class="btn btn-primary" onclick="openProductModal()">
            <i class="fas fa-plus-circle"></i> Nouveau Produit
          </button>
        </div>
      </div>

      <!-- CONTENT AREA -->
      <div class="admin-content">
        <!-- Filters -->
        <div class="admin-filters">
          <div class="form-group" style="width: 100px;">
          <select id="itemsPerPage" onchange="changeItemsPerPage()">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
          </div>
          <div class="form-group">
            <input type="text" id="searchInput" placeholder="Rechercher un produit..." />
          </div>
          <div class="form-group">
            <select id="categoryFilter">
              <option value="">Toutes les catégories</option>
            </select>
          </div>
          <button class="btn btn-secondary" onclick="resetFilters()"> <i class="fas fa-sync"></i></button>
        </div>

        

        <!-- Products Table -->
        <div class="dashboard-section card">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Image</th> 
                <th>ID</th>
                <th>Nom</th>
                <th>Catégorie</th>
                <th>Prix</th>
                <th>Stock</th>
                <th>Statut</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="productsTableBody">
              <!-- Loaded dynamically -->
            </tbody>
          </table> 
          <div class="pagination-controls" style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 10px 0;">
            <div class="pagination-info" id="paginationInfo">Aucun produit</div>
            <div class="pagination-buttons" style="display: flex; gap: 5px;">
              <button class="btn btn-sm btn-secondary" id="prevPageBtn" onclick="changePage('prev')" disabled>Précédent</button>
              <span id="currentPageDisplay" style="padding: 5px 10px;">Page 1</span>
              <button class="btn btn-sm btn-secondary" id="nextPageBtn" onclick="changePage('next')">Suivant</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- ============================================
       PRODUCT MODAL
       ============================================ -->
  <div class="admin-modal" id="productModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Nouveau Produit</h2>
        <button class="modal-close" onclick="closeProductModal()">✕</button>
      </div>

      <form id="productForm" onsubmit="saveProduct(event)">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group">
              <label>Nom du produit</label>
              <input type="text" id="productName" placeholder="Ex : Montre Rolex..." required />
            </div>

            <div class="form-group">
              <label>Catégorie</label>
              <select id="productCategory" required>
                <option value="">Sélectionnez une catégorie</option>
              </select>
            </div>

            <div class="form-group">
              <label>Prix de vente</label>
              <input type="number" id="productPrice" step="0.01" placeholder="Prix de vente" required />
            </div>

            <div class="form-group">
              <label>Prix d'achat (coût)</label>
              <input type="number" id="productCostPrice" step="0.01" min="0" placeholder="Prix d'achat">
            </div>

            <div class="form-group">
              <label>Stock</label>
              <input type="number" id="productStock" min="0" required />
            </div>

            <div class="form-group form-group-full">
              <label>Description</label>
              <textarea id="productDescription" rows="4"></textarea>
            </div>

            <div class="form-group">
              <label>Vedette?</label>
              <input type="checkbox" id="productFeatured" />
            </div>

            <div class="form-group">
              <label>Actif?</label>
              <input type="checkbox" id="productActive" checked />
            </div>

            <div class="form-group form-group-full">
              <label>Images</label>
              <div class="file-input-wrapper">
                <!-- Pas de multiple : sur Firefox/Android le bouton Ouvrir bloque souvent la multi-sélection -->
                <input type="file" id="productImages" name="images" accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg,.png,.webp,.gif" />
                <label for="productImages" class="file-input-label" id="productImagesLabel">
                  📸 Ajouter une image
                </label>
              </div>
              <p class="text-gray" style="margin:0.4rem 0 0;font-size:0.8rem;" id="productImagesHint">
                Ajoutez les images une par une : rouvrez le sélecteur pour chaque photo. Elles s’accumulent ci-dessous.
              </p>
              <div class="file-preview" id="imagePreview"></div>
            </div>

            <!-- Dans le modal, après la section images -->
            <div class="form-group form-group-full">
              <label>🎨 Variations du produit</label>
              <div class="variations-container" id="variationsContainer">
                <!-- Les variations seront ajoutées ici -->
              </div>
              <button type="button" class="btn btn-secondary btn-sm" onclick="addVariationField()" style="margin-top: 10px;">
                + Ajouter une variation
              </button>
            </div>

            <!-- Palette de couleurs (cachée) -->
            <div id="colorPalette" class="color-palette" style="display: none;">
              <div class="color-palette-grid">
                <div class="color-option" style="background: #D4AF37;" onclick="selectColor('Or', '#D4AF37')" title="Or"></div>
                <div class="color-option" style="background: #C0C0C0;" onclick="selectColor('Argent', '#C0C0C0')" title="Argent"></div>
                <div class="color-option" style="background: #B76E79;" onclick="selectColor('Or Rose', '#B76E79')" title="Or Rose"></div>
                <div class="color-option" style="background: #000000;" onclick="selectColor('Noir', '#000000')" title="Noir"></div>
                <div class="color-option" style="background: #FFFFFF; border: 1px solid #ddd;" onclick="selectColor('Blanc', '#FFFFFF')" title="Blanc"></div>
                <div class="color-option" style="background: #FF0000;" onclick="selectColor('Rouge', '#FF0000')" title="Rouge"></div>
                <div class="color-option" style="background: #0000FF;" onclick="selectColor('Bleu', '#0000FF')" title="Bleu"></div>
                <div class="color-option" style="background: #00FF00;" onclick="selectColor('Vert', '#00FF00')" title="Vert"></div>
                <div class="color-option" style="background: #FFFF00;" onclick="selectColor('Jaune', '#FFFF00')" title="Jaune"></div>
                <div class="color-option" style="background: #FFC0CB;" onclick="selectColor('Rose', '#FFC0CB')" title="Rose"></div>
                <div class="color-option" style="background: #800080;" onclick="selectColor('Violet', '#800080')" title="Violet"></div>
                <div class="color-option" style="background: #FFA500;" onclick="selectColor('Orange', '#FFA500')" title="Orange"></div>
                <div class="color-option" style="background: #A52A2A;" onclick="selectColor('Marron', '#A52A2A')" title="Marron"></div>
                <div class="color-option" style="background: #808080;" onclick="selectColor('Gris', '#808080')" title="Gris"></div>
                <div class="color-option" style="background: #00FFFF;" onclick="selectColor('Cyan', '#00FFFF')" title="Cyan"></div>
                <div class="color-option" style="background: #FF00FF;" onclick="selectColor('Magenta', '#FF00FF')" title="Magenta"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeProductModal()">
            Annuler
          </button>
          <button type="submit" class="btn btn-primary">
            Enregistrer
          </button>
        </div>
      </form>
    </div>
  </div>

    <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script src="../js/admin-products.js"></script>
</body>
</html>
