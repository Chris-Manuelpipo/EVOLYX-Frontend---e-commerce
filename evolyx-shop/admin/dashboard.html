<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('evolyx-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* stockage indisponible */ }
    })();
  </script>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1814">

  <title>Dashboard Admin - EVOLYX</title>
  <meta name="robots" content="noindex">
    <link rel="icon" href="../assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <!-- ✅ Favicon --> 
  
  <!-- Dans le <head> de votre HTML -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <!-- ============================================
       ADMIN LAYOUT
       ============================================ -->
  <div class="admin-container">
    <!-- SIDEBAR -->
    <aside class="admin-sidebar" id="admin-sidebar"></aside>


    <!-- MAIN CONTENT -->
    <main class="admin-main">
      <!-- TOPBAR -->
      <div class="admin-topbar">
        <div class="topbar-content">
          <h1>Dashboard</h1>
          <div class="topbar-user">
            <span id="userGreeting">Connecté</span>
            <i class="fa-solid fa-user fa-fade"></i>
            <button class="btn btn-sm btn-secondary" onclick="logout()">Quitter</button>
          </div>
        </div>
      </div>

      <!-- CONTENT AREA -->
      <div class="admin-content">
        <!-- Stats Cards -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-box"></i></div>
            <div class="stat-info">
              <p class="stat-label">Produits</p>
              <p class="stat-value" id="totalProducts">0</p>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-shopping-cart"></i></div>
            <div class="stat-info">
              <p class="stat-label">Commandes</p>
              <p class="stat-value" id="totalOrders">0</p>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-sack-dollar"></i> </div>
            <div class="stat-info">
              <p class="stat-label">Revenus (ce mois)</p>
              <p class="stat-value text-gold" id="monthlyRevenue">0 FCFA</p>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-hourglass-half"></i></div>
            <div class="stat-info">
              <p class="stat-label">Commandes en attente</p>
              <p class="stat-value" id="pendingOrders">0</p>
            </div>
          </div>
        </div>

        <!-- Recent Orders -->
        <div class="dashboard-section card">
          <div class="section-header">
            <h2>Commandes Récentes</h2>
            <a href="orders.html" class="btn btn-sm btn-primary">Voir tout</a>
          </div>

          <table class="dashboard-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Client</th>
                <th>Montant</th>
                <th>Statut</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="recentOrdersTable">
              <!-- Loaded dynamically -->
            </tbody>
          </table>
        </div>

        <!-- Top Products -->
        <div class="dashboard-section card">
          <div class="section-header">
            <h2>Produits Populaires</h2>
            <a href="products.html" class="btn btn-sm btn-primary">Voir tout</a>
          </div>

          <table class="dashboard-table">
            <thead>
              <tr>
                <th>Produit</th>
                <th>Ventes</th>
                <th>Stock</th>
                <th>Prix</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="topProductsTable">
              <!-- Loaded dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

    <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script src="../js/admin-dashboard.js"></script>
</body>
</html>
