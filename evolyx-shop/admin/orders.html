<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion Commandes - EVOLYX Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ✅ Favicon -->
  <link rel="icon"  href="../assets/favicon.png">
</head>
<body>
  <div class="admin-container">
    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <h2 style="color: #D4AF37; margin: 0;">EVOLYX</h2>
        <p style="color: #999; font-size: 12px; margin: 0;">Panel Administrateur </p>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <span class="icon"><i class="fa-regular fa-chart-bar"></i></i></span>
          <span>Dashboard</span>
        </a>
        <a href="products.html" class="nav-item">
          <span class="icon"><i class="fas fa-box"></i></span>
          <span>Produits</span>
        </a>
        <a href="categories.html" class="nav-item">
          <span class="icon"><i class="fas fa-tags"></i></span>
          <span>Catégories</span>
        </a>
        <a href="orders.html" class="nav-item active">
          <span class="icon"><i class="fas fa-shopping-cart"></i></span>
          <span>Commandes</span>
        </a>
        <a href="variations.html" class="nav-item">
          <span class="icon"><i class="fas fa-palette"></i></span>
          <span>Variations</span>
        </a>
        <a href="stats.html" class="nav-item a">
            <span class="icon"><i class="fa-solid fa-chart-simple"></i></span>
            <span>Statistiques</span>
        </a>
        
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-sm" onclick="logout()" style="width: 100%;">
          Déconnexion<i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main">
      <!-- TOPBAR -->
      <div class="admin-topbar">
        <div class="topbar-content">
          <h1>Gestion Commandes</h1>
        </div>
      </div>

      <!-- CONTENT AREA -->
      <div class="admin-content">
        <!-- Filters --> 
        <div class="admin-filters" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
          <div class="form-group" style="min-width: 200px;">
            <select id="statusFilter" class="form-control">
              <option value="">Tous les statuts</option>
              <option value="pending">En attente</option>
              <option value="confirmed">Confirmée</option>
              <option value="cancelled">Annulée</option>
            </select>
          </div>

          <!-- ✅ Nouveaux filtres de date -->
          <div class="form-group" style="min-width: 150px;">
            <input type="date" id="dateFrom" class="form-control" placeholder="Date début">
          </div>

          <div class="form-group" style="min-width: 150px;">
            <input type="date" id="dateTo" class="form-control" placeholder="Date fin">
          </div>

          <button class="btn btn-secondary" onclick="resetFilters()"><i class="fas fa-sync-alt"></i></button>
        </div>
        <!-- Orders Table -->
        <div class="dashboard-section card">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Client</th>
                <th>Téléphone</th>
                <th>Montant</th>
                <th>Statut</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <!-- Loaded dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ============================================
       ORDER DETAIL MODAL
       ============================================ -->
  <div class="admin-modal" id="orderModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="orderModalTitle">Détails Commande</h2>
        <button class="modal-close" onclick="closeOrderModal()">✕</button>
      </div>

      <div class="modal-body">
        <div id="orderDetails">
          <!-- Loaded dynamically -->
        </div>

        <div style="margin-top: 20px;">
          <label>Changer le statut:</label>
          <select id="orderStatusSelect">
            <option value="pending">En attente</option>
            <option value="confirmed">Confirmée</option> 
            <option value="cancelled">Annulée</option>
          </select>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeOrderModal()">
          Fermer
        </button>
        <button type="button" class="btn btn-primary" onclick="updateOrderStatus()">
          Mettre à jour le statut
        </button>
      </div>
    </div>
  </div>

  <!-- ============================================
       SCRIPTS
       ============================================ -->
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-orders.js"></script>
</body>
</html>
