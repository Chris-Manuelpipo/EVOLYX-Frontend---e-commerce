<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('evolyx-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* stockage indisponible */ }
    })();
  </script>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1814">

  <title>Gestion Commandes - EVOLYX Admin</title>
  <meta name="robots" content="noindex">
    <link rel="icon" href="../assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ✅ Favicon -->
  
</head>
<body>
  <div class="admin-container">
    <!-- SIDEBAR -->
    <aside class="admin-sidebar" id="admin-sidebar"></aside>


    <!-- MAIN CONTENT -->
    <main class="admin-main">
      <!-- TOPBAR -->
      <div class="admin-topbar">
        <div class="topbar-content">
          <h1>Gestion Commandes</h1>
        </div>
      </div>

      <!-- CONTENT AREA -->
      <div class="admin-content">
        <!-- Filters --> 
        <div class="admin-filters" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
          <div class="form-group" style="min-width: 200px;">
            <select id="statusFilter" class="form-control">
              <option value="">Tous les statuts</option>
              <option value="pending">En attente</option>
              <option value="confirmed">Confirmée</option>
              <option value="preparing">En préparation</option>
              <option value="shipped">Expédiée</option>
              <option value="delivered">Livrée</option>
              <option value="cancelled">Annulée</option>
            </select>
          </div>

          <!-- ✅ Nouveaux filtres de date -->
          <div class="form-group" style="min-width: 150px;">
            <input type="date" id="dateFrom" class="form-control" placeholder="Date début">
          </div>

          <div class="form-group" style="min-width: 150px;">
            <input type="date" id="dateTo" class="form-control" placeholder="Date fin">
          </div>

          <button class="btn btn-secondary" onclick="resetFilters()"><i class="fas fa-sync-alt"></i></button>
          <p id="filterStats" class="text-sm text-gray"></p>
        </div>
        <!-- Orders Table -->
        <div class="dashboard-section card">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Client</th>
                <th>Téléphone</th>
                <th>Montant</th>
                <th>Statut</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <!-- Loaded dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ============================================
       ORDER DETAIL MODAL
       ============================================ -->
  <div class="admin-modal" id="orderModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="orderModalTitle">Détails Commande</h2>
        <button class="modal-close" onclick="closeOrderModal()">✕</button>
      </div>

      <div class="modal-body">
        <div id="orderDetails">
          <!-- Loaded dynamically -->
        </div>

        <div style="margin-top: 20px;">
          <label>Changer le statut:</label>
          <select id="orderStatusSelect"></select>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeOrderModal()">
          Fermer
        </button>
        <button type="button" class="btn btn-primary" onclick="updateOrderStatus(this)">
          Mettre à jour le statut
        </button>
      </div>
    </div>
  </div>

    <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script src="../js/admin-orders.js"></script>
</body>
</html>
