<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('evolyx-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* stockage indisponible */ }
    })();
  </script>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1814">

  <title>Gestion Catégories - EVOLYX Admin</title>
  <meta name="robots" content="noindex">
    <link rel="icon" href="../assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ✅ Favicon --> 
  
</head>
<body>
  <div class="admin-container">
    <!-- SIDEBAR -->
    <aside class="admin-sidebar" id="admin-sidebar"></aside>


    <!-- MAIN CONTENT -->
    <main class="admin-main">
      <!-- TOPBAR -->
      <div class="admin-topbar">
        <div class="topbar-content">
          <h1>Gestion Catégories</h1>
          <button class="btn btn-primary" onclick="openCategoryModal()">
            <i class="fas fa-plus-circle"></i> Nouvelle Catégorie
          </button>
        </div>
      </div>

      <!-- CONTENT AREA -->
      <div class="admin-content">
        <!-- Categories Table -->
        <div class="dashboard-section card">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Description</th>  
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="categoriesTableBody">
              <!-- Loaded dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ============================================
       CATEGORY MODAL
       ============================================ -->
  <div class="admin-modal" id="categoryModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Nouvelle Catégorie</h2>
        <button class="modal-close" onclick="closeCategoryModal()">✕</button>
      </div>
<td>
      
      <form id="categoryForm" onsubmit="saveCategory(event)">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group form-group-full">
              <label>Nom de la catégorie</label>
              <input type="text" id="categoryName" required />
            </div>

            <div class="form-group form-group-full">
              <label>Description</label>
              <textarea id="categoryDescription" rows="4"></textarea>
            </div>

            <!-- <div class="form-group">
              <label>Catégorie parent</label>
              <select id="categoryParent">
                <option value="">Aucune (catégorie racine)</option>
              </select>
            </div> -->

            <!-- <div class="form-group">
              <label>Actif?</label>
              <input type="checkbox" id="categoryActive" checked />
            </div> -->
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeCategoryModal()">
            Annuler
          </button>
          <button type="submit" class="btn btn-primary">
            Enregistrer
          </button>
        </div>
      </form>
    </div>
  </div>

    <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script src="../js/admin-categories.js"></script>
</body>
</html>
