<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('evolyx-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* stockage indisponible */ }
    })();
  </script>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1814">
  <title>Retours - EVOLYX Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="admin-container">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <div class="admin-topbar">
        <div class="topbar-content">
          <h1>Retours</h1>
        </div>
      </div>
      <div class="admin-content">
        <div id="returnsNotice"></div>
        <div class="dashboard-section card">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Commande</th>
                <th>Motif</th>
                <th>Statut</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="returnsTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script src="../js/admin-returns.js"></script>
</body>
</html>
