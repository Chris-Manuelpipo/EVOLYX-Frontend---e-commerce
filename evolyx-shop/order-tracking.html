<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('evolyx-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* stockage indisponible */ }
    })();
  </script>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1814">
  <title>Suivi de commande : EVOLYX Shop</title>
  <meta name="description" content="Suivez l’état de votre commande EVOLYX : en attente, confirmée, préparée, expédiée ou livrée.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="EVOLYX Shop">
  <!-- gsc -->
  <meta property="og:title" content="Suivi de commande : EVOLYX Shop">
  <meta property="og:description" content="Retrouvez votre commande EVOLYX avec son numéro.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shop.evolyx.cm/order-tracking.html">
  <meta property="og:image" content="https://shop.evolyx.cm/assets/og-image.png">
  <meta property="og:site_name" content="EVOLYX Shop">
  <link rel="canonical" href="https://shop.evolyx.cm/order-tracking.html">
  <link rel="alternate" type="text/plain" title="LLM" href="https://shop.evolyx.cm/llms.txt">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#orderId">Aller au suivi</a>
  <div id="site-header"></div>

  <main class="page-main">
    <div class="container">
      <h1>Suivi de commande</h1>
      <div class="tracking-form card">
        <form onsubmit="searchOrder(event)">
          <div class="form-group">
            <label for="orderId">Numéro de commande</label>
            <input type="text" id="orderId" name="orderId" placeholder="Ex. 18" required>
            <small class="text-gray">Utilisez le lien de suivi reçu après validation (numéro + jeton).</small>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Rechercher</button>
        </form>
      </div>
      <div id="trackingResult"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/order-tracking.js"></script>
</body>
</html>
