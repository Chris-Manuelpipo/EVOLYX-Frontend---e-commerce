<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('evolyx-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* stockage indisponible : préférence système */ }
    })();
  </script>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1814">

  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=mobile-2col2">
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var keys = ['q', 'category_id', 'min_price', 'max_price', 'sort', 'in_stock', 'page'];
      var hasFilter = keys.some(function (key) { return params.get(key); });
      if (location.hash === '#catalog' || hasFilter) {
        location.replace('catalog.html' + location.search);
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#featuredSection">Aller aux produits</a>
  <div id="site-header"></div>

  <main>
    <section class="featured" id="featuredSection">
      <div class="container">
        <div class="section-head">
          <h1 id="homeGridTitle">Nouveautés</h1>
          <a href="catalog.html">Tout voir</a>
        </div>
        <div class="products-grid" id="featuredGrid"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
