<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('evolyx-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* stockage indisponible : préférence système */ }
    })();
  </script>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1814">
  <title>EVOLYX Shop : boutique en ligne à Yaoundé</title>
  <meta name="description" content="Boutique EVOLYX à Yaoundé. Commandez par WhatsApp, suivez votre commande, livraison au Cameroun.">
  <meta property="og:title" content="EVOLYX Shop : boutique en ligne à Yaoundé">
  <meta property="og:description" content="Catalogue EVOLYX. Commande confirmée par WhatsApp, suivi et livraison au Cameroun.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shop.evolyx.cm/">
  <meta property="og:image" content="https://shop.evolyx.cm/assets/og-image.png">
  <meta property="og:site_name" content="EVOLYX Shop">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="EVOLYX Shop : boutique en ligne à Yaoundé">
  <meta name="twitter:description" content="Boutique EVOLYX à Yaoundé. Commandez par WhatsApp, suivez votre commande, livraison au Cameroun.">
  <meta name="twitter:image" content="https://shop.evolyx.cm/assets/og-image.png">
  <link rel="canonical" href="https://shop.evolyx.cm/">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#catalog">Aller au catalogue</a>
  <div id="site-header"></div>

  <main>
    <section class="hero">
      <div class="container hero-content">
        <p class="hero-kicker">Yaoundé, Cameroun</p>
        <h1>Boutique EVOLYX</h1>
        <p>Choisissez un produit, commandez, confirmez par WhatsApp. Livraison au Cameroun, suivi inclus.</p>
        <div class="hero-actions">
          <a href="#catalog" class="btn btn-primary">Voir le catalogue</a>
          <a href="order-tracking.html" class="btn btn-outline">Suivre une commande</a>
        </div>
      </div>
    </section>

    <section class="featured" id="featuredSection" hidden>
      <div class="container">
        <h2>En vedette</h2>
        <div class="products-grid" id="featuredGrid"></div>
      </div>
    </section>

    <section class="catalog" id="catalog">
      <div class="container">
        <h2>Catalogue</h2>
        <div class="filters">
          <div class="form-group">
            <label for="searchInput">Recherche</label>
            <input type="search" id="searchInput" class="search-input" placeholder="Nom du produit…" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="categoryFilter">Catégorie</label>
            <select id="categoryFilter">
              <option value="">Toutes les catégories</option>
            </select>
          </div>
          <div class="form-group">
            <label for="sortFilter">Tri</label>
            <select id="sortFilter">
              <option value="">Pertinence</option>
              <option value="newest">Nouveautés</option>
              <option value="price_asc">Prix croissant</option>
              <option value="price_desc">Prix décroissant</option>
              <option value="featured">Vedettes</option>
            </select>
          </div>
          <div class="form-group">
            <label for="minPrice">Prix min (FCFA)</label>
            <input type="number" id="minPrice" min="0" step="500" inputmode="numeric" placeholder="0">
          </div>
          <div class="form-group">
            <label for="maxPrice">Prix max (FCFA)</label>
            <input type="number" id="maxPrice" min="0" step="500" inputmode="numeric" placeholder="—">
          </div>
          <div class="form-group form-check">
            <label for="inStockFilter">
              <input type="checkbox" id="inStockFilter"> En stock
            </label>
          </div>
          <button type="button" class="btn btn-secondary" id="resetFilter">
            Réinitialiser <i class="fas fa-rotate" aria-hidden="true"></i>
          </button>
        </div>
        <div class="products-grid" id="productsGrid"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
