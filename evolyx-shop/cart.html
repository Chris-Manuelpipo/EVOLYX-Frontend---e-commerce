<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('evolyx-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* stockage indisponible */ }
    })();
  </script>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1814">
  <title>Panier : EVOLYX Shop</title>
  <meta name="description" content="Votre panier EVOLYX. Vérifiez les quantités puis commandez par WhatsApp.">
  <meta name="robots" content="noindex, follow">
  <meta name="author" content="EVOLYX Shop">
  <meta property="og:title" content="Panier : EVOLYX Shop">
  <meta property="og:description" content="Panier et commande WhatsApp EVOLYX.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shop.evolyx.cm/cart.html">
  <meta property="og:image" content="https://shop.evolyx.cm/assets/og-image.png">
  <meta property="og:site_name" content="EVOLYX Shop">
  <meta property="og:locale" content="fr_FR">
  <link rel="canonical" href="https://shop.evolyx.cm/cart.html">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/style.css?v=mobile-2col2">
</head>
<body>
  <a class="skip-link" href="#cartContent">Aller au panier</a>
  <div id="site-header"></div>

  <main class="page-main">
    <div class="container">
      <h1>Panier</h1>
      <div id="cartContent"></div>
    </div>
  </main>

  <div id="checkoutModal" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Livraison</h2>
        <button type="button" class="modal-close" onclick="closeCheckoutModal()" aria-label="Fermer">✕</button>
      </div>
      <form id="checkoutForm" onsubmit="submitCheckout(event)">
        <div class="modal-body">
          <div class="form-group">
            <label for="checkoutName">Nom complet</label>
            <input type="text" id="checkoutName" name="name" autocomplete="name" required>
          </div>
          <div class="form-group">
            <label for="checkoutPhone">Téléphone</label>
            <div class="phone-row">
              <select id="countryCode" aria-label="Indicatif">
                <option value="237" selected>+237</option>
                <option value="225">+225</option>
                <option value="241">+241</option>
                <option value="242">+242</option>
                <option value="243">+243</option>
              </select>
              <input type="tel" id="checkoutPhone" name="phone" inputmode="tel" placeholder="6 54 80 49 07" required>
            </div>
          </div>
          <div class="form-group">
            <label for="checkoutAddress">Adresse de livraison</label>
            <textarea id="checkoutAddress" name="address" rows="3" placeholder="Ville, quartier, repère…" required></textarea>
          </div>
          <p>Total : <strong id="checkoutTotal" class="text-gold"></strong></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeCheckoutModal()">Annuler</button>
          <button type="submit" class="btn btn-primary">Confirmer</button>
        </div>
      </form>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/layout.js?v=footer-copy"></script>
  <script src="js/cart.js"></script>
</body>
</html>
